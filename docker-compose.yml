services:
  backend:
    build:
      context: ./backend
    environment:
      DEMO_RESET_TOKEN: ${DEMO_RESET_TOKEN:-local-dev-reset-token}
    ports:
      - "8010:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: http://localhost:8010
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8010
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8010
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8010
    ports:
      - "3010:3000"
    depends_on:
      - backend
